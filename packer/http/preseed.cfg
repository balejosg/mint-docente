# Preseed para Ubiquity (Linux Mint 22.3 XFCE) — instalación desatendida.

# Idioma, país y teclado
d-i debian-installer/locale string es_ES.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string ES
d-i localechooser/supported-locales multiselect es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i keyboard-configuration/layoutcode string es
d-i keyboard-configuration/modelcode string pc105
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string mint-docente
d-i netcfg/get_domain string local

# Disco completo, sin LVM ni cifrado
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/default_filesystem string ext4
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# Usuario: docente / docente, con inicio de sesión automático
d-i passwd/user-fullname string Docente
d-i passwd/username string docente
d-i passwd/user-password password docente
d-i passwd/user-password-again password docente
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i passwd/auto-login boolean true

# Sin códecs ni actualizaciones durante la instalación (se hacen después)
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/minimal_install boolean false

# Tras instalar: SSH temporal para Packer (se desactiva al final del build).
# Durante la instalación NO hay red (casper la desactiva tras descargar este
# preseed) y debconf no admite órdenes complejas. Por eso el script va aquí
# mismo, en las líneas "#POST" (debconf las ignora como comentarios): casper
# guarda este fichero en /tmp/preseed.cfg y success_command las extrae.
ubiquity ubiquity/success_command string \
  sed -n 's/^#POST //p' /tmp/preseed.cfg > /target/root/postinstalacion.sh ; \
  sh /target/root/postinstalacion.sh > /target/root/postinstalacion.log 2>&1

#POST #!/bin/sh
#POST # Ejecutado por Ubiquity (success_command) en el entorno del instalador, con el
#POST # sistema instalado en /target. Deja preparado el acceso SSH temporal para Packer:
#POST # openssh-server se instala en el PRIMER ARRANQUE (aquí no hay DNS).
#POST set -x
#POST cat > /target/etc/systemd/system/packer-ssh.service <<'UNIT'
#POST [Unit]
#POST Description=SSH temporal para Packer (lo retira 90-limpieza)
#POST Wants=network-online.target
#POST After=network-online.target
#POST 
#POST [Service]
#POST Type=oneshot
#POST ExecStart=/bin/sh -c 'until apt-get -o DPkg::Lock::Timeout=600 update && DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y openssh-server; do sleep 10; done; systemctl enable --now ssh'
#POST 
#POST [Install]
#POST WantedBy=multi-user.target
#POST UNIT
#POST mkdir -p /target/etc/systemd/system/multi-user.target.wants
#POST ln -sf /etc/systemd/system/packer-ssh.service /target/etc/systemd/system/multi-user.target.wants/
#POST echo 'docente ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/99-packer
#POST chmod 440 /target/etc/sudoers.d/99-packer

ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/poweroff boolean false
