# Preseed para Ubiquity (Linux Mint 22.3 XFCE) — instalación desatendida.

# Idioma, país y teclado
d-i debian-installer/locale string es_ES.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string ES
d-i localechooser/supported-locales multiselect es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i keyboard-configuration/layoutcode string es
d-i keyboard-configuration/modelcode string pc105
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string mint-docente
d-i netcfg/get_domain string local

# Disco completo, sin LVM ni cifrado
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/default_filesystem string ext4
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# Usuario: docente / docente, con inicio de sesión automático
d-i passwd/user-fullname string Docente
d-i passwd/username string docente
d-i passwd/user-password password docente
d-i passwd/user-password-again password docente
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i passwd/auto-login boolean true

# Sin códecs ni actualizaciones durante la instalación (se hacen después)
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/minimal_install boolean false

# Tras instalar: SSH temporal para Packer (se desactiva al final del build).
# En el chroot /target, resolv.conf apunta al stub de systemd-resolved, que no
# está activo: usamos temporalmente el DNS de la NAT de VirtualBox (10.0.2.3).
ubiquity ubiquity/success_command string \
  mv /target/etc/resolv.conf /target/etc/resolv.conf.orig ; \
  echo 'nameserver 10.0.2.3' > /target/etc/resolv.conf ; \
  in-target apt-get update ; \
  in-target apt-get install -y openssh-server ; \
  in-target systemctl enable ssh ; \
  rm -f /target/etc/resolv.conf ; \
  mv /target/etc/resolv.conf.orig /target/etc/resolv.conf ; \
  echo 'docente ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/99-packer ; \
  chmod 440 /target/etc/sudoers.d/99-packer

ubiquity ubiquity/reboot boolean true
ubiquity ubiquity/poweroff boolean false
